# myCoach: un solo Worker con la web, su API y el conector MCP de Garmin.
# Tu Claude se conecta a https://mycoach.albertbecervas.workers.dev/mcp
name = "mycoach"
main = "src/unico.js"
compatibility_date = "2026-09-01"

# La web (un solo HTML) se sirve como estáticos. El Worker va primero en todo:
# decide si la petición es del conector, de la API o un estático.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# Descarga diaria de Garmin para el panel de progreso. De madrugada, cuando
# el sueño y la VFC de la noche ya están puestos.
[triggers]
crons = ["30 5 * * *", "0 17 * * SUN"]

# Un solo KV con dos nombres: GARMIN (el conector: usuarios, tokens de Garmin, datos de la app)
# y SESIONES (las sesiones de la web, con el prefijo "mc:").
[[kv_namespaces]]
binding = "GARMIN"
id = "7711af0372714afd942bf460cff02518"

[[kv_namespaces]]
binding = "SESIONES"
id = "7711af0372714afd942bf460cff02518"

[[d1_databases]]
binding = "LOGS"
database_name = "garmin-diag"
database_id = "32c6dc43-3fb2-469e-85e8-6f503ea8a925"

# SIGNING_KEY (firma los tokens OAuth y cifra la clave de Intervals.icu) no se declara aquí:
# se sube en cada despliegue con --secrets-file desde los secretos del repo.

# Pruebas (mycoach-pruebas): el código de una rama en otra URL, con los mismos datos.
# Lo despliega el CI a mano ("Run workflow") desde una rama que no sea main. Sin cron.
[env.pruebas]
name = "mycoach-pruebas"

[env.pruebas.triggers]
crons = []

[[env.pruebas.kv_namespaces]]
binding = "GARMIN"
id = "7711af0372714afd942bf460cff02518"

[[env.pruebas.kv_namespaces]]
binding = "SESIONES"
id = "7711af0372714afd942bf460cff02518"

[[env.pruebas.d1_databases]]
binding = "LOGS"
database_name = "garmin-diag"
database_id = "32c6dc43-3fb2-469e-85e8-6f503ea8a925"
