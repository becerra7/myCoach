name = "mycoach"
main = "src/index.js"
compatibility_date = "2026-09-01"

# La web (un solo HTML) se sirve como estáticos; /api/* pasa por el Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp-app"]

[vars]
# URL del Worker del conector de Garmin (repo garmin-mcp). Sin barra final.
GARMIN_URL = "https://garmin.albertbecervas.workers.dev"

# Worker a Worker sin pasar por internet (por URL pública, Cloudflare devuelve 404).
[[services]]
binding = "GARMIN_SVC"
service = "garmin"

# Sesiones de la web (id aleatorio en cookie → tokens OAuth del conector).
# De momento comparte el KV del conector de Garmin, con todas las claves bajo
# el prefijo "mc:" para no pisar nada. Si se separa: `wrangler kv namespace
# create SESIONES` y cambiar aquí el id.
[[kv_namespaces]]
binding = "SESIONES"
id = "7711af0372714afd942bf460cff02518"

# Web de pruebas (mycoach-pruebas): el código de una rama contra el conector
# de pruebas (garmin-pruebas), sin tocar la web ni el conector de producción.
# La despliega el CI a mano ("Run workflow") desde cualquier rama que no sea
# main. Hay que desplegar antes garmin-pruebas: el service binding lo exige.
[env.pruebas]
name = "mycoach-pruebas"

[env.pruebas.vars]
GARMIN_URL = "https://garmin-pruebas.albertbecervas.workers.dev"

[[env.pruebas.services]]
binding = "GARMIN_SVC"
service = "garmin-pruebas"

[[env.pruebas.kv_namespaces]]
binding = "SESIONES"
id = "7711af0372714afd942bf460cff02518"
