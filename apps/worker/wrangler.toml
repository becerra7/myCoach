name = "mycoach"
main = "src/index.js"
compatibility_date = "2026-09-01"

# La web (un solo HTML) se sirve como estáticos; /api/* pasa por el Worker.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# URL del Worker del conector de Garmin (repo garmin-mcp). Sin barra final.
GARMIN_URL = "https://garmin.albertbecervas.workers.dev"

# Sesiones de la web (id aleatorio en cookie → tokens OAuth del conector).
# De momento comparte el KV del conector de Garmin, con todas las claves bajo
# el prefijo "mc:" para no pisar nada. Si se separa: `wrangler kv namespace
# create SESIONES` y cambiar aquí el id.
[[kv_namespaces]]
binding = "SESIONES"
id = "7711af0372714afd942bf460cff02518"
