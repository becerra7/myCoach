name: Android
# La app mínima de Android (el widget de Hoy). No se publica en ninguna tienda:
# deja el APK como artefacto de la ejecución para instalarlo a mano en el teléfono.
on:
  workflow_dispatch:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Compilar
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mycoach-android
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
