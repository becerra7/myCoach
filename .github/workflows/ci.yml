name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
  deploy:
    # Despliega solo desde main y solo si hay credenciales de Cloudflare configuradas.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      # Un despliegue no está bien hasta que la web y la API contestan.
      - name: Comprobación post-despliegue
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for intento in 1 2 3 4 5; do
            me=$(curl -fsS https://mycoach.albertbecervas.workers.dev/api/me || true)
            html=$(curl -fsS https://mycoach.albertbecervas.workers.dev/ | head -c 200 || true)
            if echo "$me" | grep -q '"conectado"' && echo "$html" | grep -qi '<!doctype html'; then echo "OK: $me"; exit 0; fi
            echo "Intento $intento: api=$me"; sleep 6
          done
          exit 1
