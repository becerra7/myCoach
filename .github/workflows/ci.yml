name: CI
on:
  push:
    branches: [main]
  pull_request:
  # A mano desde una rama que no sea main: despliega la web de pruebas
  # (mycoach-pruebas) contra el conector de pruebas. Producción no se toca.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
  deploy:
    # Despliega solo desde main y solo si hay credenciales de Cloudflare configuradas.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      # Un despliegue no está bien hasta que la web y la API contestan.
      - name: Comprobación post-despliegue
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for intento in 1 2 3 4 5; do
            me=$(curl -fsS https://mycoach.albertbecervas.workers.dev/api/me || true)
            html=$(curl -fsS https://mycoach.albertbecervas.workers.dev/ | head -c 200 || true)
            if echo "$me" | grep -q '"conectado"' && echo "$html" | grep -qi '<!doctype html'; then echo "OK web y API: $me"; break; fi
            echo "Intento $intento: api=$me"; sleep 6
            [ "$intento" = 5 ] && exit 1
          done
          # Login con Garmin: registra la web en el conector y redirige a su pantalla de autorizar
          code=$(curl -sS -o /tmp/login.txt -w '%{http_code}' https://mycoach.albertbecervas.workers.dev/api/login)
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' https://mycoach.albertbecervas.workers.dev/api/login)
          echo "login: $code -> $loc"; cat /tmp/login.txt; echo
          [ "$code" = 302 ] && echo "$loc" | grep -q '^https://garmin.albertbecervas.workers.dev/oauth/authorize?' || exit 1
          auth=$(curl -sS -o /tmp/auth.html -w '%{http_code}' "$loc")
          echo "pantalla de autorizar: $auth"; head -c 300 /tmp/auth.html; echo
          [ "$auth" = 200 ] || exit 1
  deploy-pruebas:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Sin credenciales no hay despliegue
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "Faltan CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en los secretos del repo"; exit 1; }
      - name: Deploy de pruebas
        run: npm run build && npx wrangler deploy -c apps/worker/wrangler.toml --env pruebas
      - name: Comprobación post-despliegue
        run: |
          for intento in 1 2 3 4 5; do
            me=$(curl -fsS https://mycoach-pruebas.albertbecervas.workers.dev/api/me || true)
            if echo "$me" | grep -q '"conectado"'; then echo "OK pruebas: $me"; exit 0; fi
            echo "Intento $intento: $me"; sleep 6
          done
          exit 1
