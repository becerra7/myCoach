name: CI
on:
  push:
    branches: [main]
  pull_request:
  # A mano desde una rama que no sea main: despliega la web de pruebas
  # (mycoach-pruebas) contra el conector de pruebas. Producción no se toca.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
  deploy:
    # Un solo Worker (mycoach): la web, su API y el conector MCP. Despliega desde main.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Sin las tres credenciales no se despliega: un Worker sin SIGNING_KEY tira el conector.
      - name: Credenciales
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN en los secretos del repo"; exit 1; }
          test -n "$SIGNING_KEY" || { echo "Falta SIGNING_KEY en los secretos del repo"; exit 1; }
      # El secreto viaja con el código: un `wrangler deploy` a secas dejó una vez el conector sin SIGNING_KEY.
      - name: Deploy
        run: |
          npm run build
          printf '{"SIGNING_KEY":"%s"}' "$SIGNING_KEY" > .secrets.json
          npx wrangler deploy -c apps/worker/wrangler.toml --secrets-file .secrets.json
          rm -f .secrets.json
      # Un despliegue no está bien hasta que la web, la API y el conector contestan.
      - name: Comprobación post-despliegue
        run: bash .github/comprobar.sh https://mycoach.albertbecervas.workers.dev
  deploy-pruebas:
    # A mano ("Run workflow") desde una rama que no sea main: mycoach-pruebas, con los mismos datos.
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Credenciales
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN en los secretos del repo"; exit 1; }
          test -n "$SIGNING_KEY" || { echo "Falta SIGNING_KEY en los secretos del repo"; exit 1; }
      - name: Deploy de pruebas
        run: |
          npm run build
          printf '{"SIGNING_KEY":"%s"}' "$SIGNING_KEY" > .secrets.json
          npx wrangler deploy -c apps/worker/wrangler.toml --env pruebas --secrets-file .secrets.json
          rm -f .secrets.json
      - name: Comprobación post-despliegue
        run: bash .github/comprobar.sh https://mycoach-pruebas.albertbecervas.workers.dev
