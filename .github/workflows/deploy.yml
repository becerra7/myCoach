name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# El despliegue solo necesita leer el repo; el acceso a Cloudflare va por
# el token, no por el GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Sin tests en verde no se despliega. Es la unica red que hay: el
      # servidor solo se ejerce de verdad contra Garmin en produccion, asi
      # que lo que se puede comprobar antes, se comprueba antes.
      - name: Tests
        run: node test.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
